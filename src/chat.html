<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat | Wild Connections</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/pages.css">

    <style>
        /* Chat Layout */
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background: var(--bg-base);
        }
        
        .chat-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
            margin-top: 72px; /* Navbar height compensation */
        }

        /* Sidebar */
        .chat-sidebar {
            width: 280px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .chat-sidebar-header {
            padding: var(--space-4);
            border-bottom: 1px solid var(--border);
        }

        .chat-sidebar-header h2 {
            font-family: 'Cinzel', serif;
            font-size: 1.25rem;
            color: var(--text-primary);
            margin: 0;
        }

        .chat-sidebar-header h2 span {
            color: var(--gold-primary);
        }

        .chat-conversations {
            flex: 1;
            overflow-y: auto;
        }

        .conversation-item {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-4);
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            border-left: 3px solid transparent;
            transition: all 0.2s ease;
        }

        .conversation-item:hover {
            background: rgba(255,255,255,0.02);
        }

        .conversation-item.active {
            background: rgba(212, 175, 55, 0.05);
            border-left-color: var(--gold-primary);
        }

        .conversation-info {
            flex: 1;
            overflow: hidden;
        }

        .conversation-name {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.95rem;
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversation-preview {
            color: var(--text-secondary);
            font-size: 0.8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversation-time {
            font-size: 0.7rem;
            color: var(--text-secondary);
            align-self: flex-start;
            margin-top: 0.25rem;
        }

        /* Chat Panel */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-base);
            position: relative;
        }

        .chat-header {
            display: flex;
            align-items: center;
            padding: var(--space-4);
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            gap: var(--space-4);
        }

        .chat-back-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            padding: var(--space-2);
        }

        .chat-header-info {
            flex: 1;
        }

        .chat-header-name {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 1.1rem;
            margin: 0 0 0.15rem 0;
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
        }

        .chat-header-specialty {
            color: var(--gold-primary);
            font-size: 0.85rem;
            margin: 0;
        }

        /* Messages Area */
        .chat-messages {
            flex: 1;
            padding: var(--space-5);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
        }

        .message {
            max-width: 75%;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            animation: fadeInUp 0.3s ease forwards;
        }

        .message-content {
            padding: var(--space-3) var(--space-4);
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .message-time {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin: 0 var(--space-2);
        }

        /* User Message */
        .message.user {
            align-self: flex-end;
        }

        .message.user .message-content {
            background: rgba(212, 175, 55, 0.25);
            border: 1px solid rgba(212, 175, 55, 0.5);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.user .message-time {
            text-align: right;
        }

        /* Mentor Message */
        .message.mentor {
            align-self: flex-start;
        }

        .message.mentor .message-content {
            background: #1a1a24;
            border: 1px solid #2a2a38;
            color: #E2E8F0;
            border-bottom-left-radius: 4px;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: none;
            padding: var(--space-3) var(--space-4);
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
            width: fit-content;
        }

        .typing-indicator.active {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Input Area */
        .chat-input-area {
            padding: var(--space-4);
            background: var(--bg-surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: var(--space-3);
            align-items: center;
        }

        .chat-input {
            flex: 1;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 12px 20px;
            color: var(--text-primary);
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--gold-primary);
            background: rgba(212, 175, 55, 0.05);
        }

        .chat-send-btn {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chat-send-btn:hover {
            background: var(--gold-primary);
            color: var(--bg-base);
        }

        .chat-send-btn svg {
            width: 20px;
            height: 20px;
            margin-left: -2px; /* slight visual optical alignment */
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .chat-sidebar {
                position: absolute;
                top: 0;
                left: 0;
                height: 100%;
                z-index: 10;
                transform: translateX(-100%);
            }
            .chat-sidebar.open {
                transform: translateX(0);
            }
            .chat-back-btn {
                display: block;
            }
        }
    </style>
</head>
<body class="theme-dark">

    <!-- Logged-in Navbar -->
    <nav class="navbar" style="position: fixed; top: 0; width: 100%; z-index: 100;">
        <div class="container navbar-inner">
            <a href="dashboard.html" class="nav-brand nav-logo"><img src="assets/logos/logo-principal-blanco.png" alt="Wild Connections" class="nav-logo-img" style="height:40px"></a>
            <div class="nav-links">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="matches.html" class="nav-link">Matches Recomendados</a>
                <a href="conexiones.html" class="nav-link">Mis Conexiones</a>
            </div>
            <div class="nav-actions">
                <a href="login.html" class="nav-link" style="margin-right: 15px; font-size: 0.9rem; font-weight: 600;">Ingresar</a>
                <button class="nav-notification btn-icon" aria-label="Notificaciones">
                    <span class="nav-notification-dot"></span>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                </button>
                <div style="display: flex; align-items: center; gap: var(--space-3); border-left: 1px solid var(--border); padding-left: var(--space-4); margin-left: var(--space-2);">
                    <img src="assets/mentor-isabella.jpg" class="avatar avatar-sm avatar-gold user-avatar" alt="Usuario" style="width: 40px; height: 40px; border-radius: 50%;">
                </div>
                <button class="nav-toggle" aria-label="Abrir menú"><span></span><span></span><span></span></button>
            </div>
        </div>
    </nav>

    <div class="chat-container">
        <!-- Sidebar -->
        <aside class="chat-sidebar" id="chatSidebar">
            <div class="chat-sidebar-header">
                <h2>Mensajes</h2>
            </div>
            <div class="chat-conversations" id="conversationList">
                <!-- Populated by JS -->
            </div>
        </aside>

        <!-- Main Chat Panel -->
        <main class="chat-panel">
            <!-- Header -->
            <header class="chat-header">
                <button class="chat-back-btn" id="btnBackToConexiones" aria-label="Volver">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
                </button>
                <img src="" id="chatMentorAvatar" class="avatar avatar-sm avatar-gold" alt="Mentor">
                <div class="chat-header-info">
                    <h3 class="chat-header-name" id="chatMentorName">
                        Cargando... <span class="online-dot"></span>
                    </h3>
                    <p class="chat-header-specialty" id="chatMentorSpecialty">Cargando...</p>
                </div>
            </header>

            <!-- Messages List -->
            <div class="chat-messages" id="chatMessagesArea">
                <!-- Messages populated by JS -->
                
                <div class="typing-indicator" id="typingIndicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="messageInput" placeholder="Escribe un mensaje..." autocomplete="off">
                <button class="chat-send-btn" id="btnSendMessage" aria-label="Enviar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script type="module" src="/js/supabase-client.js"></script>
    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/chat.js"></script>
</body>
</html>
