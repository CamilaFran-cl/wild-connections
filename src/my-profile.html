    <style>
        .my-profile-page {
            padding: var(--space-8) 0;
            background: radial-gradient(circle at top right, rgba(212, 175, 55, 0.05), transparent 40%);
        }
        .profile-edit-card {
            background: rgba(26, 26, 26, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-lg);
            padding: var(--space-8);
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        .avatar-edit-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: var(--space-4);
        }
        .avatar-edit-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--gold-primary);
            color: #000;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .avatar-edit-btn:hover {
            transform: scale(1.1);
        }
        .form-group {
            margin-bottom: var(--space-5);
            text-align: left;
        }
        .form-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: var(--space-2);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .form-control {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            padding: 14px 16px;
            border-radius: var(--radius-md);
            font-family: var(--font-secondary);
            font-size: 1rem;
            transition: all var(--transition-fast);
        }
        .form-control:focus {
            outline: none;
            border-color: var(--gold-primary);
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.1);
            background: rgba(0, 0, 0, 0.5);
        }
        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }
        .action-buttons {
            display: flex;
            gap: var(--space-4);
            margin-top: var(--space-6);
        }
    </style>
</head>

        </div>

    <main class="my-profile-page page-content">
        <div class="container text-center">
            
            <div class="profile-edit-card reveal">
                <h1 class="pricing-title" style="font-size: 2rem; margin-bottom: 2rem;">Mi Perfil</h1>
                
                <form id="profile-form" style="display: none;">
                    <div class="avatar-edit-wrapper">
                        <img src="assets/mentor-isabella.jpg" alt="Mi Foto" class="avatar avatar-xl profile-avatar-glow" id="profile-avatar-preview">
                        <button type="button" class="avatar-edit-btn" id="btn-change-photo" title="Cambiar Foto">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                        </button>
                        <input type="file" id="photo-upload" accept="image/jpeg, image/png, image/webp" style="display: none;">
                    </div>

                    <div class="form-group">
                        <label for="profile-name" class="form-label">Tu Nombre</label>
                        <input type="text" id="profile-name" class="form-control" placeholder="Ej: Valentina" required>
                    </div>

                    <div class="form-group">
                        <label for="profile-phrase" class="form-label">Especialidad o Nicho</label>
                        <input type="text" id="profile-phrase" class="form-control" placeholder="Ej: Diseño de Productos, Copywriting..." required>
                    </div>

                    <div class="form-group">
                        <label for="profile-needs" class="form-label">Acerca de ti (Bio / Necesidades)</label>
                        <textarea id="profile-needs" class="form-control" placeholder="Describe brevemente quién eres, qué necesitas hoy de la comunidad o qué puedes aportar..."></textarea>
                    </div>

                    <div class="action-buttons">
                        <button type="submit" class="btn btn-gold btn-block shimmer-effect">Guardar Cambios</button>
                        <button type="button" id="btn-cancel-edit" class="btn btn-outline btn-block">Cancelar</button>
                    </div>
                </form>

                <!-- Vista de Solo Lectura -->
                <div id="profile-view" style="text-align: center;">
                    <div class="avatar-edit-wrapper">
                        <img src="assets/mentor-isabella.jpg" alt="Mi Foto" class="avatar avatar-xl profile-avatar-glow" id="view-avatar" style="object-fit: cover;">
                    </div>
                    <h2 id="view-name" style="margin-top: 1rem; margin-bottom: 0.5rem; font-family: var(--font-primary); font-size: 1.8rem;">Cargando...</h2>
                    <p id="view-phrase" style="color: var(--gold-primary); font-weight: 500; font-size: 1.1rem; margin-bottom: 1rem;">-</p>
                    <p id="view-needs" style="color: var(--text-secondary); margin-bottom: 2rem; line-height: 1.6;">-</p>
                    
                    <div class="action-buttons">
                        <button type="button" id="btn-edit-mode" class="btn btn-gold btn-block shimmer-effect">Editar Perfil</button>
                        <button type="button" id="btn-logout" class="btn btn-outline btn-block" style="border-color: rgba(255,100,100,0.5); color: #ff8888;">Cerrar Sesión</button>
                    </div>
                </div>
            </div>

        </div>
    </main>
