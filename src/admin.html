<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración — Wild Connections</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="theme-dark">

    <div class="admin-layout">
        
        <!-- Lock Screen -->
        <div class="admin-lock-screen" id="lock-screen">
            <div class="lock-card">
                <div class="lock-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                </div>
                <h2 class="auth-title" style="margin-bottom: var(--space-2);">Acceso Restringido</h2>
                <p class="text-secondary text-sm">Ingresa la clave de acceso de Wild Goddess Magazine para ver los registros.</p>
                
                <input type="password" id="admin-pin" class="form-input form-input-glass lock-input" placeholder="••••••••" autocomplete="off">
                <p class="error-msg" id="pin-error">Contraseña incorrecta.</p>
                
                <button class="btn btn-gold w-full" id="btn-unlock">Desbloquear Panel</button>
            </div>
        </div>

        <!-- Admin Header -->
        <header class="admin-header">
            <div class="admin-title">
                <img src="assets/logos/monograma-crema.png" alt="WGM" style="height: 24px;">
                Panel de Control
            </div>
            <a href="index.html" class="btn btn-outline btn-sm">Volver al sitio</a>
        </header>

        <!-- Main Content -->
        <main class="admin-content">
            
            <!-- Metrics -->
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    </div>
                    <div class="metric-info">
                        <h3>Total Registradas</h3>
                        <p id="metric-total">0</p>
                    </div>
                </div>
                
                <div class="metric-card">
                    <div class="metric-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                    </div>
                    <div class="metric-info">
                        <h3>+USD $6,000/mes</h3>
                        <p id="metric-revenue">0</p>
                    </div>
                </div>

                <div class="metric-card">
                    <div class="metric-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
                    </div>
                    <div class="metric-info">
                        <h3>Etapa: Escalando</h3>
                        <p id="metric-scaling">0</p>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="table-controls">
                <div class="search-box">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="admin-search" class="form-input form-input-glass" placeholder="Buscar por nombre, nicho o instagram...">
                </div>
                <button class="btn btn-gold" id="btn-export">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Exportar a Excel (CSV)
                </button>
            </div>

            <!-- Data Table -->
            <div class="table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Usuaria</th>
                            <th>Instagram</th>
                            <th>Nicho</th>
                            <th>Etapa</th>
                            <th>Facturación</th>
                            <th>Fecha</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body">
                        <!-- Populated by JS -->
                        <tr>
                            <td colspan="6" style="text-align: center; padding: 3rem;">
                                <div class="loading-dots" style="justify-content: center;"><span></span><span></span><span></span></div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/database.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
