<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Wild Connections</title>
    <meta name="description" content="Ingresa a tu cuenta de Wild Connections.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-8) var(--space-4);
            background: radial-gradient(circle at top right, rgba(212, 175, 55, 0.05), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(212, 175, 55, 0.05), transparent 40%);
        }
        
        .login-card {
            background: rgba(26, 26, 26, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-lg);
            padding: var(--space-8);
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .login-logo {
            height: 32px;
            margin-bottom: var(--space-6);
        }

        .login-title {
            font-family: var(--font-primary);
            font-size: 1.75rem;
            color: var(--text-primary);
            margin-bottom: var(--space-2);
        }

        .login-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: var(--space-6);
        }

        .form-group {
            margin-bottom: var(--space-4);
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: var(--space-2);
        }

        .form-control {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-family: var(--font-secondary);
            transition: all var(--transition-fast);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--gold-primary);
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.1);
            background: rgba(0, 0, 0, 0.4);
        }
        
        .forgot-password {
            display: block;
            text-align: right;
            font-size: 0.8rem;
            color: var(--gold-primary);
            margin-top: 8px;
            text-decoration: none;
        }
        
        .forgot-password:hover {
            text-decoration: underline;
        }

        .login-footer {
            margin-top: var(--space-6);
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .login-footer a {
            color: var(--gold-primary);
            text-decoration: none;
            font-weight: 500;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }
        
        .btn-login {
            margin-top: var(--space-2);
            position: relative;
        }
        
        /* Spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
        
        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        .btn-loading .btn-text {
            visibility: hidden;
        }
        
        .btn-loading .spinner {
            display: block;
        }

        .back-home {
            position: absolute;
            top: var(--space-6);
            left: var(--space-6);
            color: var(--text-secondary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            transition: color var(--transition-fast);
        }

        .back-home:hover {
            color: var(--gold-primary);
        }

        @media (max-width: 768px) {
            .back-home {
                top: var(--space-4);
                left: var(--space-4);
            }
            .login-card {
                padding: var(--space-6) var(--space-4);
            }
        }
    </style>
</head>
<body class="theme-dark">

    <a href="index.html" class="back-home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Volver
    </a>

    <main class="login-page">
        <div class="login-card reveal">
            <img src="assets/logos/logo-principal-blanco.png" alt="Wild Connections" class="login-logo">
            
            <h1 class="login-title">Bienvenida de nuevo</h1>
            <p class="login-subtitle">Ingresa a tu red exclusiva de mentoría</p>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control" placeholder="tu@correo.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </div>
                
                <button type="submit" class="btn btn-gold btn-block btn-login shimmer-effect" id="login-btn">
                    <span class="btn-text">Iniciar Sesión</span>
                    <div class="spinner"></div>
                </button>
            </form>
            
            <div class="login-footer">
                ¿No tienes una cuenta? <a href="onboarding.html">Regístrate Gratis</a>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js?v=2"></script>
    <script src="js/main.js?v=2"></script>
    <script src="js/login.js?v=2"></script>
</body>
</html>
