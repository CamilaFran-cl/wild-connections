<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Conexiones — Wild Connections</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>

    <!-- NAVBAR LOGGED IN -->
    <nav class="navbar">
        <div class="container navbar-inner">
            <a href="dashboard.html" class="nav-brand nav-logo"><img src="assets/logos/logo-principal-blanco.png" alt="Wild Connections" class="nav-logo-img" style="height:60px"></a>
            <div class="nav-links">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="matches.html" class="nav-link">Matches Recomendados</a>
                <a href="conexiones.html" class="nav-link active">Mis Conexiones</a>
            </div>
            <div class="nav-actions">
                <a href="login.html" class="nav-link" style="margin-right: 15px; font-size: 0.9rem; font-weight: 600;">Ingresar</a>
                <button class="nav-notification btn-icon" aria-label="Notificaciones">
                    <span class="nav-notification-dot"></span>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                </button>

                <button class="nav-toggle" aria-label="Abrir menú"><span></span><span></span><span></span></button>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="page-content" style="padding-top: calc(80px + var(--space-8));">
        <div class="container">
            
            <div class="section-header animate-fadeInUp" style="margin-bottom: var(--space-8);">
                <h1 class="section-title text-gold" style="text-align: left; margin-bottom: var(--space-2);">Mis Conexiones</h1>
                <p class="section-subtitle" style="text-align: left; margin: 0;">Personas con las que has establecido contacto y agendado sesiones.</p>
            </div>

            <!-- TABS -->
            <div class="tabs mb-8 animate-fadeInUp delay-1" style="display: flex; gap: var(--space-4); border-bottom: 1px solid var(--border); padding-bottom: var(--space-4);">
                <button class="tab-btn-cx active" data-tab="activas" style="background: none; border: none; color: var(--gold-primary); border-bottom: 2px solid var(--gold-primary); border-radius: 0; padding-bottom: var(--space-4); margin-bottom: calc(var(--space-4) * -1); font-family: var(--font-primary); font-weight: 600; font-size: 1rem; cursor: pointer;">Activas (<span id="count-activas">0</span>)</button>
                <button class="tab-btn-cx" data-tab="pendientes" style="background: none; border: none; color: var(--text-secondary); font-family: var(--font-primary); font-size: 1rem; cursor: pointer;">Pendientes (<span id="count-pendientes">0</span>)</button>
                <button class="tab-btn-cx" data-tab="historial" style="background: none; border: none; color: var(--text-secondary); font-family: var(--font-primary); font-size: 1rem; cursor: pointer;">Historial</button>
            </div>

            <!-- CONEXIONES CONTENT -->
            <div id="tab-activas" class="tab-cx-content animate-fadeInUp delay-2">
                <div class="grid-3" id="conexiones-activas"></div>
            </div>
            <div id="tab-pendientes" class="tab-cx-content" style="display: none;">
                <div class="grid-3" id="conexiones-pendientes"></div>
            </div>
            <div id="tab-historial" class="tab-cx-content" style="display: none;">
                <div class="grid-3" id="conexiones-historial"></div>
            </div>

        </div>
    </main>

    <!-- MOBILE NAV -->
    <nav class="mobile-nav">
        <div class="mobile-nav-inner">
            <a href="login.html" class="mobile-nav-item" style="color: var(--gold-primary);">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                Ingresar
            </a>
            <a href="dashboard.html" class="mobile-nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                Inicio
            </a>
            <a href="matches.html" class="mobile-nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                Matches
            </a>
            <a href="conexiones.html" class="mobile-nav-item active">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                Mensajes
            </a>
            <a href="#" class="mobile-nav-item">
                <img src="assets/mentor-isabella.jpg" class="user-avatar" style="width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--gold-primary);">
                Perfil
            </a>
        </div>
    </nav>

    <script type="module" src="/js/supabase-client.js"></script>
    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/conexiones.js"></script>
</body>
</html>
